name: secret-demo
on: workflow_dispatch

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Tester le secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN est vide"
            exit 1
          fi
          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Valeur : $DEMO_TOKEN"

      - name: Afficher la variable
        run: echo "APP_ENV = ${{ vars.APP_ENV }}"