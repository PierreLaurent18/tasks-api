name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Lancer les tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Calculer le nom de l'image et la version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/api" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.vars.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      packages: read
    steps:
      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déployer l'image du commit
        run: |
          IMAGE_TAG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/api:sha-${GITHUB_SHA::7}"
          docker run -d --rm --name api-staging -p 8000:8000 "$IMAGE_TAG"

      - name: Smoke tests (health & version)
        run: |
          curl --retry 10 --retry-delay 2 --retry-all-errors --retry-connrefused -f http://127.0.0.1:8000/health
          curl --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused -f http://127.0.0.1:8000/version

      - name: Nettoyer le conteneur
        if: always()
        run: docker stop api-staging || true

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: read
    steps:
      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déployer l'image de la release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_TAG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/api:${VERSION}"
          docker run -d --rm --name api-production -p 8000:8000 "$IMAGE_TAG"

      - name: Smoke tests (health & version)
        run: |
          curl --retry 10 --retry-delay 2 --retry-all-errors --retry-connrefused -f http://127.0.0.1:8000/health
          curl --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused -f http://127.0.0.1:8000/version

      - name: Nettoyer le conteneur
        if: always()
        run: docker stop api-production || true
  update-config:
    needs: deploy-production            # TROU 1
    if: startsWith(github.ref, 'refs/tags/')   # TROU 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}   # le nom du tag, par exemple v0.2.0
    steps:
      - name: Récupérer le dépôt applicatif
        uses: actions/checkout@v6       # même version que vos autres jobs

      - name: Récupérer le dépôt de configuration
        uses: actions/checkout@v6
        with:
          repository: pierrelaurent18/tasks-config  # TROU 3
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config                  # TROU 4

      - name: Mettre à jour la version de l'image
        run: bash scripts/set-image-tag.sh config/k8s/deployment.yaml "${VERSION#v}"

      - name: Commiter et pousser dans tasks-config
        run: |
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml   # TROU 5
          git commit -m "Déploiement de tasks-api ${VERSION#v}"
          git push